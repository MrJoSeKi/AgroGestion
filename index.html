    const formatDateES = (isoOrDate) => {
      if (!isoOrDate) return "";
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(isoOrDate)) return isoOrDate;
      const clean = String(isoOrDate).split("T")[0];
      const parts = clean.split("-");
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      return isoOrDate;
    };

      return `${yyyy}-${mm}-${dd}`;

    // --- COMPONENTE SILUETA SIGPAC ---
    function SigpacPreview({ provincia = "29", municipio = "015", poligono, parcela, compact = false }) {
      const [svgPath, setSvgPath] = useState(null);
      const [areaInfo, setAreaInfo] = useState(null);
      const [status, setStatus] = useState("idle");

      useEffect(() => {
        const prov = String(provincia || "").trim();
        const mun = String(municipio || "").trim();
        const pol = String(poligono || "").trim();
        const par = String(parcela || "").trim();

        if (!prov || !mun || !pol || !par) {
          setSvgPath(null);
          setStatus("idle");
          return;
        }

        let cancelled = false;
        const timer = setTimeout(async () => {
          setStatus("loading");
          try {
            const url = `https://sigpac-hubcloud.es/servicioconsultassigpac/query/recinfoparc/${prov}/${mun}/0/0/${pol}/${par}.geojson`;
            const res = await fetch(url);
            if (!res.ok) throw new Error("No encontrado");
            const data = await res.json();
            if (cancelled) return;

            const features = data.features || (data.type === "Feature" ? [data] : []);
            if (!features.length) {
              setSvgPath(null);
              setStatus("notfound");
              return;
            }

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            const rings = [];
            let totalAreaM2 = 0;

            features.forEach((f) => {
              if (f.properties && f.properties.dn_surface) {
                totalAreaM2 += Number(f.properties.dn_surface) || 0;
              }
              const geom = f.geometry;
              if (!geom) return;
              const polys = geom.type === "Polygon" ? [geom.coordinates] : geom.type === "MultiPolygon" ? geom.coordinates : [];
              polys.forEach((poly) => {
                poly.forEach((ring) => {
                  rings.push(ring);
                  ring.forEach(([x, y]) => {
                    if (x < minX) minX = x;
                    if (y < minY) minY = y;
                    if (x > maxX) maxX = x;
                    if (y > maxY) maxY = y;
                  });
                });
              });
            });

            if (!rings.length || !isFinite(minX)) {
              setSvgPath(null);
              setStatus("notfound");
              return;
            }

            const width = maxX - minX || 1;
            const height = maxY - minY || 1;
            const scale = 160 / Math.max(width, height);
            const offsetX = (200 - width * scale) / 2;
            const offsetY = (200 - height * scale) / 2;

            const pathStr = rings
              .map((ring) =>
                ring
                  .map(([x, y], idx) => {
                    const px = (offsetX + (x - minX) * scale).toFixed(1);
                    const py = (200 - (offsetY + (y - minY) * scale)).toFixed(1);
                    return `${idx === 0 ? "M" : "L"}${px},${py}`;
                  })
                  .join(" ") + " Z"
              )
              .join(" ");

            setSvgPath(pathStr);
            setAreaInfo(totalAreaM2 > 0 ? (totalAreaM2 / 10000).toFixed(2) + " ha" : null);
            setStatus("ok");
          } catch (e) {
            if (!cancelled) {
              setSvgPath(null);
              setStatus("error");
            }
          }
        }, 500);

        return () => {
          cancelled = true;
          clearTimeout(timer);
        };
      }, [provincia, municipio, poligono, parcela]);

      const visorUrl = `https://sigpac.mapa.gob.es/fega/visor/`;

      if (compact) {
        if (status !== "ok" || !svgPath) return null;
        return (
          <div className="flex flex-col items-center justify-center bg-emerald-50/70 border border-emerald-200 rounded-xl p-2 shrink-0">
            <svg viewBox="0 0 200 200" className="w-16 h-16">
              <path d={svgPath} fill="#10b981" fillOpacity="0.3" stroke="#047857" strokeWidth="4" />
            </svg>
            {areaInfo && <span className="text-[10px] font-bold text-emerald-800 mt-0.5">{areaInfo}</span>}
          </div>
        );
      }

      return (
        <div className="mt-3 bg-slate-50 border border-slate-200 rounded-xl p-3 flex flex-col items-center">
          <div className="w-full flex items-center justify-between text-xs text-slate-600 mb-2">
            <span className="font-semibold">Vista previa SIGPAC (Pol. {poligono || "-"} / Parc. {parcela || "-"})</span>
            <a href={visorUrl} target="_blank" rel="noreferrer" className="text-emerald-700 font-semibold underline">
              Abrir Visor
            </a>
          </div>
          {status === "loading" && <p className="text-xs text-slate-500 py-6">Cargando contorno oficial SIGPAC...</p>}
          {status === "ok" && svgPath && (
            <div className="flex flex-col items-center">
              <svg viewBox="0 0 200 200" className="w-36 h-36 bg-white rounded-lg border border-slate-200 shadow-inner">
                <path d={svgPath} fill="#10b981" fillOpacity="0.35" stroke="#065f46" strokeWidth="3.5" />
              </svg>
              {areaInfo && <span className="text-xs font-bold text-emerald-800 mt-1.5">Superficie SIGPAC: {areaInfo}</span>}
            </div>
          )}
          {(status === "notfound" || status === "error") && (
            <p className="text-xs text-slate-500 py-4 text-center">
              No se pudo cargar el contorno automático ahora (comprueba Provincia/Municipio/Polígono/Parcela o conexión).
            </p>
          )}
          {status === "idle" && (
            <p className="text-xs text-slate-400 py-4 text-center">Introduce Polígono y Parcela para dibujar la forma de la finca.</p>
          )}
        </div>
      );
    }

      const [selectedCategory, setSelectedCategory] = useState(null);
      const [inventoryModal, setInventoryModal] = useState(null);

      // UI States Cuentas
      const [financeModal, setFinanceModal] = useState(null);

      // --- CONEXIÓN FIREBASE EN TIEMPO REAL ---
      useEffect(() => {
        const initCloud = () => {
          const fb = window.FirebaseBridge;
          if (!fb) return;

          fb.signInAnonymously(fb.auth).catch((err) => {
            console.error("Auth error:", err);
            setCloudStatus("offline");
          });

          const unsubAuth = fb.onAuthStateChanged(fb.auth, (user) => {
            if (user) {
              setUserId(user.uid);
              const docRef = fb.doc(fb.db, "agrogestion_data", "main_workspace");
              fb.onSnapshot(
                docRef,
                (snap) => {
                  if (snap.exists()) {
                    const d = snap.data();
                    isRemoteUpdate.current = true;
                    if (d.tractors) setTractors(d.tractors);
                    if (d.parcels) setParcels(d.parcels);
                    if (d.labors) setLabors(d.labors);
                    if (d.inventory) setInventory(d.inventory);
                    if (d.finances) setFinances(d.finances);
                    setTimeout(() => { isRemoteUpdate.current = false; }, 100);
                  } else {
                    fb.setDoc(docRef, {
                      tractors,
                      parcels,
                      labors,
                      inventory,
                      finances,
                      updatedAt: new Date().toISOString()
                    });
                  }
                  setCloudStatus("synced");
                },
                (err) => {
                  console.error("Firestore error:", err);
                  setCloudStatus("offline");
                }
              );
            }
          });

          return unsubAuth;
        };

        if (window.FirebaseBridge) {
          initCloud();
        } else {
          window.addEventListener("firebase-ready", initCloud, { once: true });
        }
      }, []);

      // Guardado automático en localStorage y Firebase
      useEffect(() => {
        try {
          localStorage.setItem("agrogestion_tractors", JSON.stringify(tractors));
          localStorage.setItem("agrogestion_parcels", JSON.stringify(parcels));
          localStorage.setItem("agrogestion_labors", JSON.stringify(labors));
          localStorage.setItem("agrogestion_inventory", JSON.stringify(inventory));
          localStorage.setItem("agrogestion_finances", JSON.stringify(finances));
        } catch {}

        if (isRemoteUpdate.current) return;
        const fb = window.FirebaseBridge;
        if (fb && userId && cloudStatus === "synced") {
          const docRef = fb.doc(fb.db, "agrogestion_data", "main_workspace");
          fb.setDoc(docRef, {
            tractors,
            parcels,
            labors,
            inventory,
            finances,
            updatedAt: new Date().toISOString()
          }).catch(() => setCloudStatus("offline"));
        }
      }, [tractors, parcels, labors, inventory, finances, userId]);

      // --- HELPERS TRACTORES ---
      const getBarData = (tractor, key, interval) => {
        const last = Number(tractor.lastService?.[key] ?? 0);
        const current = Number(tractor.currentHours ?? 0);
        const used = Math.max(0, current - last);
        const remaining = interval - used;
        const pct = Math.min(100, Math.max(0, (used / interval) * 100));
        let barColor = "bg-emerald-500";
        let textColor = "text-emerald-700";
        if (remaining <= 0) {
          barColor = "bg-rose-600";
          textColor = "text-rose-700 font-bold";
        } else if (remaining <= 50) {
          barColor = "bg-amber-500";
          textColor = "text-amber-700 font-bold";
        }
        return { used, remaining, pct, barColor, textColor, interval };
      };

      const getTractorOverallStatus = (tractor) => {
        const checks = [
          getBarData(tractor, "motorOil", 300),
          getBarData(tractor, "motorOilFilter", 300),
          getBarData(tractor, "airMotorFilter", 500),
          getBarData(tractor, "airCabinFilter", 500),
          getBarData(tractor, "fuelPrimaryFilter", 300),
          getBarData(tractor, "fuelSecondaryFilter", 300),
          getBarData(tractor, "hydraulicOil", 600),
          getBarData(tractor, "hydraulicFilter", 600)
        ];
        if (checks.some((c) => c.remaining <= 0)) return { label: "Mantenimiento vencido", cls: "bg-rose-100 text-rose-800 border-rose-200" };
        if (checks.some((c) => c.remaining <= 50)) return { label: "Próximo servicio", cls: "bg-amber-100 text-amber-800 border-amber-200" };
        return { label: "Al día", cls: "bg-emerald-100 text-emerald-800 border-emerald-200" };
      };

      const handleSaveHours = (e) => {
        e.preventDefault();
        if (!hoursModalTractor) return;
        const val = Number(newHoursValue);
        if (isNaN(val) || val < 0) return;
        setTractors((prev) =>
          prev.map((t) => (t.id === hoursModalTractor.id ? { ...t, currentHours: val } : t))
        );
        setHoursModalTractor(null);
      };

      const handleSaveMaintenance = (e) => {
        e.preventDefault();
        if (!maintModalTractor) return;
        const opt = MAINTENANCE_OPTIONS.find((o) => o.id === maintForm.typeId) || MAINTENANCE_OPTIONS[0];
        const serviceHours = maintForm.hours !== "" ? Number(maintForm.hours) : Number(maintModalTractor.currentHours);
        const costNum = Number(maintForm.cost) || 0;

        const newRecord = {
          id: "m-" + Date.now(),
          typeId: opt.id,
          label: opt.label,
          badgeClass: opt.badgeClass,
          hours: serviceHours,
          date: maintForm.date || todayISO(),
          cost: costNum,
          notes: maintForm.notes
        };

        setTractors((prev) =>
          prev.map((t) => {
            if (t.id !== maintModalTractor.id) return t;
            const updatedLast = { ...(t.lastService || {}) };
            opt.resets.forEach((key) => {
              updatedLast[key] = serviceHours;
            });
            return {
              ...t,
              currentHours: Math.max(Number(t.currentHours), serviceHours),
              lastService: updatedLast,
              history: [newRecord, ...(t.history || [])]
            };
          })
        );

        if (costNum > 0) {
          setFinances((prev) => [
            {
              id: "fin-" + Date.now(),
              type: "gasto",
              concept: `${opt.label} - ${maintModalTractor.brand} ${maintModalTractor.model}`,
              category: "Taller y Recambios",
              amount: costNum,
              date: maintForm.date || todayISO()
            },
            ...prev
          ]);
        }

        setMaintModalTractor(null);
      };

      const handleDeleteMaintenance = (tractorId, recordId) => {
        setTractors((prev) =>
          prev.map((t) => {
            if (t.id !== tractorId) return t;
            const remainingHistory = (t.history || []).filter((h) => h.id !== recordId);
            return { ...t, history: remainingHistory };
          })
        );
      };

      const openNewTractorForm = () => {
        setEditingTractorForm({
          isNew: true,
          id: "tr-" + Date.now(),
          brand: "",
          model: "",
          plate: "",
          vin: "",
          year: "",
          engine: "",
          power: "",
          currentHours: 0,
          oilMotorSpec: "15W-40",
          oilMotorLiters: "",
          oilHydraulicSpec: "UTTO",
          oilHydraulicLiters: "",
          filterOilRef: "",
          filterAirMotorRef: "",
          filterAirCabinRef: "",
          filterFuelPrimaryRef: "",
          filterFuelSecondaryRef: "",
          filterHydraulicRef: "",
          notes: "",
          lastService: {
            motorOil: 0,
            motorOilFilter: 0,
            airMotorFilter: 0,
            airCabinFilter: 0,
            fuelPrimaryFilter: 0,
            fuelSecondaryFilter: 0,
            hydraulicOil: 0,
            hydraulicFilter: 0
          },
          history: []
        });
      };

      const handleSaveTractorForm = (e) => {
        e.preventDefault();
        if (!editingTractorForm) return;
        const { isNew, ...cleanTractor } = editingTractorForm;
        cleanTractor.currentHours = Number(cleanTractor.currentHours) || 0;
        if (isNew) {
          setTractors((prev) => [...prev, cleanTractor]);
        } else {
          setTractors((prev) => prev.map((t) => (t.id === cleanTractor.id ? cleanTractor : t)));
          if (specsModalTractor && specsModalTractor.id === cleanTractor.id) {
            setSpecsModalTractor(cleanTractor);

        setEditingTractorForm(null);

      const handleSaveParcel = (e) => {

          setParcels((prev) => [...prev, cleanParcel]);

          setParcels((prev) => prev.map((p) => (p.id === cleanParcel.id ? cleanParcel : p)));

        setParcelModal(null);

          products: laborForm.products,
          notes: laborForm.notes

        setLabors((prev) => [newLabor, ...prev]);

            prev.map((t) =>

          <header className="bg-emerald-950 text-white px-4 py-3.5 sticky top-0 z-30 shadow-md">
            <div className="max-w-5xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-emerald-800 flex items-center justify-center text-emerald-200 font-black text-lg border border-emerald-700">
                  AG

                <div>
                  <h1 className="font-bold text-base leading-tight tracking-tight">AgroGestión</h1>
                  <p className="text-[11px] text-emerald-300">Cuaderno, Flota y Fincas</p>
                </div>
              </div>
              <div className="flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full bg-emerald-900/90 border border-emerald-800">
                <span
                  className={`w-2 h-2 rounded-full ${
                    cloudStatus === "synced"
                      ? "bg-emerald-400"
                      : cloudStatus === "connecting"
                      ? "bg-amber-400 animate-pulse"

                />
                <span className="text-emerald-100 font-medium">
                  {cloudStatus === "synced" ? "Nube activa" : cloudStatus === "connecting" ? "Conectando..." : "Local"}
                </span>
              </div>
            </div>
          </header>

          {/* CONTENIDO PRINCIPAL */}
          <main className="max-w-5xl mx-auto px-4 pt-5 pb-28">
            {/* ==================== PESTAÑA 1: FLOTA ==================== */}
            {activeTab === "flota" && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-xl font-extrabold text-slate-900 flex items-center gap-2">
                      <svg className="w-6 h-6 text-emerald-800 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M3 4h9l1 7"/><path d="M4 11V4"/><path d="M8 10V4"/><path d="M18 5c-.6 0-1 .4-1 1v5.6"/><path d="m10 11 11 .9c.6 0 .9.5.8 1.1l-.8 5h-1"/><circle cx="7" cy="15" r="4"/><circle cx="18" cy="18" r="2"/>
                      </svg>
                      Flota de Maquinaria
                    </h2>
                    <p className="text-xs text-slate-500">Pulsa sobre un equipo o tractor para ver sus contadores y mantenimientos</p>
                  </div>
                  <button
                    onClick={openNewTractorForm}
                    className="bg-emerald-800 hover:bg-emerald-900 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl shadow-sm active:scale-95 transition"
                  >
                    + Añadir Maquinaria
                  </button>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-3.5 items-start">
                  {tractors.map((tractor) => {
                    const isExpanded = expandedTractorId === tractor.id;
                    const status = getTractorOverallStatus(tractor);

                    const bMotorOil = getBarData(tractor, "motorOil", 300);
                    const bMotorFilter = getBarData(tractor, "motorOilFilter", 300);
                    const bAirMotor = getBarData(tractor, "airMotorFilter", 500);

                    const bAirCabin = getBarData(tractor, "airCabinFilter", 500);
                    const bFuelPrim = getBarData(tractor, "fuelPrimaryFilter", 300);
                    const bFuelSec = getBarData(tractor, "fuelSecondaryFilter", 300);

                    const bHydOil = getBarData(tractor, "hydraulicOil", 600);
                    const bHydFilter = getBarData(tractor, "hydraulicFilter", 600);

                    return (
                      <div
                        key={tractor.id}
                        className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden transition"
                      >
                        {/* CABECERA COMPACTA CLICABLE */}
                        <button
                          type="button"
                          onClick={() => setExpandedTractorId(isExpanded ? null : tractor.id)}
                          className="w-full px-4 py-3.5 flex items-center justify-between text-left hover:bg-slate-50/80 transition"
                        >
                          <div className="flex items-center gap-3 min-w-0 pr-2">
                            <div className={`w-10 h-10 rounded-xl border flex items-center justify-center shrink-0 ${
                              status.label === "Mantenimiento vencido"
                                ? "bg-rose-50 text-rose-700 border-rose-200"
                                : status.label === "Próximo servicio"
                                ? "bg-amber-50 text-amber-700 border-amber-200"
                                : "bg-emerald-50 text-emerald-800 border-emerald-200"
                            }`}>
                              <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M3 4h9l1 7"/><path d="M4 11V4"/><path d="M8 10V4"/><path d="M18 5c-.6 0-1 .4-1 1v5.6"/><path d="m10 11 11 .9c.6 0 .9.5.8 1.1l-.8 5h-1"/><circle cx="7" cy="15" r="4"/><circle cx="18" cy="18" r="2"/>
                              </svg>
                            </div>
                            <div className="min-w-0">
                              <div className="flex items-center gap-2 flex-wrap">
                                <h3 className="font-extrabold text-base text-slate-900 truncate">
                                  {tractor.brand} {tractor.model}
                                </h3>
                                <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-full border ${status.cls}`}>
                                  {status.label}
                                </span>
                              </div>
                            </div>
                          </div>
                          <div className="flex items-center gap-3 shrink-0">
                            <div className="text-right">
                              <span className="text-lg font-black text-slate-900">{tractor.currentHours}</span>
                              <span className="text-xs font-bold text-slate-500 ml-0.5">h</span>
                            </div>
                            <span className="text-slate-400 text-sm font-bold">{isExpanded ? "▲" : "▼"}</span>
                          </div>
                        </button>

                        {/* CONTENIDO DESPLEGADO */}
                        {isExpanded && (
                          <div className="px-4 pb-4 pt-2 border-t border-slate-100 space-y-4">
                            {/* BOTONES RÁPIDOS */}
                            <div className="grid grid-cols-3 gap-2">
                              <button
                                onClick={() => {
                                  setHoursModalTractor(tractor);
                                  setNewHoursValue(String(tractor.currentHours));
                                }}
                                className="bg-slate-900 text-white text-xs font-bold py-2.5 px-2 rounded-xl hover:bg-slate-800 active:scale-95 transition"
                              >
                                Actualizar Horas
                              </button>
                              <button
                                onClick={() => {
                                  setMaintModalTractor(tractor);
                                  setMaintForm({
                                    typeId: MAINTENANCE_OPTIONS[0].id,
                                    hours: String(tractor.currentHours),
                                    date: todayISO(),
                                    cost: "",
                                    notes: ""
                                  });
                                  setMaintDropdownOpen(false);
                                }}
                                className="bg-emerald-700 text-white text-xs font-bold py-2.5 px-2 rounded-xl hover:bg-emerald-800 active:scale-95 transition"
                              >
                                + Mantenimiento
                              </button>
                              <button
                                onClick={() => setSpecsModalTractor(tractor)}
                                className="bg-slate-100 text-slate-800 border border-slate-200 text-xs font-bold py-2.5 px-2 rounded-xl hover:bg-slate-200 active:scale-95 transition"

                                Ficha Técnica
                              </button>
                            </div>

                              {[

                                  </div>
                                </div>

                              {[

                        placeholder="Ej: 45"
                        value={parcelModal.parcela || ""}
                        onChange={(e) => setParcelModal({ ...parcelModal, parcela: e.target.value })}
                        className="w-full border-2 border-emerald-300 rounded-xl px-2.5 py-2 text-xs text-center font-bold"
                      />
                    </div>
                  </div>

                  <SigpacPreview
                    provincia={parcelModal.provincia ?? "29"}
                    municipio={parcelModal.municipio ?? "015"}
                    poligono={parcelModal.poligono}
                    parcela={parcelModal.parcela}
                  />
                </div>

                {/* PRODUCTOS NECESARIOS */}
                <div className="border-t border-slate-100 pt-2.5 space-y-2">
                  <div className="text-xs font-extrabold text-slate-800">Productos Necesarios para esta Finca</div>
                  <div className="flex flex-wrap gap-1.5">
                    {["Litros Cuba", "Fitosanitario", "Abono", "Otro"].map((tipo) => (
                      <button
                        key={tipo}
                        type="button"
                        onClick={() =>
                          setParcelModal({
                            ...parcelModal,
                            needs: [
                              ...(parcelModal.needs || []),
                              { id: "nd-" + Date.now() + Math.random(), type: tipo, name: "", quantity: "" }
                            ]
                          })
                        }
                        className="text-[11px] font-bold bg-emerald-50 text-emerald-900 border border-emerald-200 px-2.5 py-1 rounded-lg hover:bg-emerald-100"
                      >
                        + {tipo}
                      </button>
                    ))}
                  </div>

                  {(parcelModal.needs || []).map((item, idx) => (
                    <div key={item.id} className="grid grid-cols-12 gap-1.5 items-center bg-slate-50 p-2 rounded-xl">
                      <span className="col-span-3 text-[11px] font-bold text-emerald-800 truncate">{item.type}</span>
                      <input
                        type="text"
                        placeholder="Producto / Cuba"
                        value={item.name}
                        onChange={(e) => {
                          const copy = [...parcelModal.needs];
                          copy[idx] = { ...copy[idx], name: e.target.value };
                          setParcelModal({ ...parcelModal, needs: copy });
                        }}
                        className="col-span-5 border border-slate-300 rounded-lg px-2 py-1 text-xs bg-white"
                      />
                      <input
                        type="text"
                        placeholder="Cant. / Litros"
                        value={item.quantity}
                        onChange={(e) => {
                          const copy = [...parcelModal.needs];
                          copy[idx] = { ...copy[idx], quantity: e.target.value };
                          setParcelModal({ ...parcelModal, needs: copy });
                        }}
                        className="col-span-3 border border-slate-300 rounded-lg px-2 py-1 text-xs bg-white"
                      />
                      <button
                        type="button"
                        onClick={() =>
                          setParcelModal({
                            ...parcelModal,
                            needs: parcelModal.needs.filter((_, i) => i !== idx)
                          })
                        }
                        className="col-span-1 text-rose-600 font-bold text-xs text-center"
                      >
                        ✕
                      </button>
                    </div>
                  ))}
                </div>

                <div className="flex justify-between pt-2">
                  {!parcelModal.isNew ? (
                    <button
                      type="button"
                      onClick={() => {
                        setParcels((prev) => prev.filter((x) => x.id !== parcelModal.id));
                        setParcelModal(null);
                      }}
                      className="text-xs font-bold text-rose-600 px-3 py-2"
                    >
                      Eliminar Finca
                    </button>
                  ) : (
                    <div />
                  )}
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setParcelModal(null)}
                      className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-xl"
                    >
                      Cancelar
                    </button>
                    <button type="submit" className="px-4 py-2 text-xs font-bold text-white bg-emerald-800 rounded-xl">
                      Guardar Finca
                    </button>
                  </div>
                </div>
              </form>
            </div>
          )}

          {/* MODAL APUNTAR LABOR */}
          {laborModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <form onSubmit={handleSaveLabor} className="bg-white rounded-2xl max-w-md w-full p-5 space-y-3 shadow-xl">
                <h3 className="font-extrabold text-base text-slate-900">Apuntar Labor en Finca</h3>
                <div className="grid grid-cols-2 gap-2.5">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Finca</label>
                    <select
                      value={laborForm.parcelId}
                      onChange={(e) => setLaborForm({ ...laborForm, parcelId: e.target.value })}
                      className="w-full border border-slate-300 rounded-xl px-2.5 py-2 text-xs bg-white"
                    >
                      {parcels.map((p) => (
                        <option key={p.id} value={p.id}>
                          {p.name}
                        </option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Fecha ({formatDateES(laborForm.date)})</label>
                    <input
                      type="date"
                      value={laborForm.date}
                      onChange={(e) => setLaborForm({ ...laborForm, date: e.target.value })}
                      className="w-full border border-slate-300 rounded-xl px-2.5 py-2 text-xs"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">Tipo de Labor</label>
                  <select
                    value={laborForm.type}
                    onChange={(e) => setLaborForm({ ...laborForm, type: e.target.value })}
                    className="w-full border border-slate-300 rounded-xl px-2.5 py-2 text-xs bg-white"
                  >
                    {LABOR_TYPES.map((lt) => (
                      <option key={lt} value={lt}>
                        {lt}
                      </option>
                    ))}
                  </select>
                </div>

                <div className="grid grid-cols-3 gap-2">
                  <div className="col-span-2">
                    <label className="block text-xs font-bold text-slate-600 mb-1">Tractor usado (opcional)</label>
                    <select
                      value={laborForm.tractorId}
                      onChange={(e) => setLaborForm({ ...laborForm, tractorId: e.target.value })}
                      className="w-full border border-slate-300 rounded-xl px-2.5 py-2 text-xs bg-white"
                    >
                      <option value="">Ninguno / Manual</option>
                      {tractors.map((t) => (
                        <option key={t.id} value={t.id}>
                          {t.brand} {t.model}
                        </option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Horas</label>
                    <input
                      type="number"
                      step="0.5"
                      placeholder="0"
                      value={laborForm.hours}
                      onChange={(e) => setLaborForm({ ...laborForm, hours: e.target.value })}
                      className="w-full border border-slate-300 rounded-xl px-2.5 py-2 text-xs"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">Productos / Dosis (si aplica)</label>
                  <input
                    type="text"
                    placeholder="Ej: Cuba 2000L + 6kg Cobre"
                    value={laborForm.products}
                    onChange={(e) => setLaborForm({ ...laborForm, products: e.target.value })}
                    className="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs"
                  />
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setLaborModal(false)}
                    className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-xl"
                  >
                    Cancelar
                  </button>
                  <button type="submit" className="px-4 py-2 text-xs font-bold text-white bg-emerald-800 rounded-xl">
                    Guardar Labor
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL ARTÍCULO ALMACÉN */}
          {inventoryModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <form onSubmit={handleSaveInventory} className="bg-white rounded-2xl max-w-md w-full p-5 space-y-3 shadow-xl">
                <h3 className="font-extrabold text-base text-slate-900">
                  {inventoryModal.isNew ? "Nuevo Artículo en Almacén" : "Editar Artículo"}
                </h3>
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">Categoría</label>
                  <select
                    value={inventoryModal.category}
                    onChange={(e) => setInventoryModal({ ...inventoryModal, category: e.target.value })}
                    className="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs bg-white"
                  >
                    {INVENTORY_CATEGORIES.map((c) => (
                      <option key={c} value={c}>
                        {c}
                      </option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">Nombre del Producto *</label>
                  <input
                    type="text"
                    required
                    value={inventoryModal.name}
                    onChange={(e) => setInventoryModal({ ...inventoryModal, name: e.target.value })}
                    className="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs"
                  />
                </div>
                <div className="grid grid-cols-3 gap-2">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Cantidad</label>
                    <input
                      type="number"
                      step="0.1"
                      value={inventoryModal.quantity}
                      onChange={(e) => setInventoryModal({ ...inventoryModal, quantity: e.target.value })}
                      className="w-full border border-slate-300 rounded-xl px-2.5 py-2 text-xs"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Unidad</label>
                    <input
                      type="text"
                      placeholder="Litros / Uds / Kg"
                      value={inventoryModal.unit}
                      onChange={(e) => setInventoryModal({ ...inventoryModal, unit: e.target.value })}
                      className="w-full border border-slate-300 rounded-xl px-2.5 py-2 text-xs"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Aviso mínimo</label>
                    <input
                      type="number"
                      value={inventoryModal.minStock}
                      onChange={(e) => setInventoryModal({ ...inventoryModal, minStock: e.target.value })}
                      className="w-full border border-slate-300 rounded-xl px-2.5 py-2 text-xs"
                    />
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">Notas / Referencia</label>
                  <input
                    type="text"
                    value={inventoryModal.notes || ""}
                    onChange={(e) => setInventoryModal({ ...inventoryModal, notes: e.target.value })}
                    className="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs"
                  />
                </div>
                <div className="flex justify-between pt-2">
                  {!inventoryModal.isNew ? (
                    <button
                      type="button"
                      onClick={() => {
                        setInventory((prev) => prev.filter((x) => x.id !== inventoryModal.id));
                        setInventoryModal(null);
                      }}
                      className="text-xs font-bold text-rose-600"
                    >
                      Eliminar
                    </button>
                  ) : (
                    <div />
                  )}
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setInventoryModal(null)}
                      className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-xl"
                    >
                      Cancelar
                    </button>
                    <button type="submit" className="px-4 py-2 text-xs font-bold text-white bg-emerald-800 rounded-xl">
                      Guardar
                    </button>
                  </div>
                </div>
              </form>
            </div>
          )}

          {/* MODAL GASTO / INGRESO */}
          {financeModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <form onSubmit={handleSaveFinance} className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3 shadow-xl">
                <h3 className="font-extrabold text-base text-slate-900">
                  {financeModal.type === "ingreso" ? "Nuevo Ingreso" : "Nuevo Gasto"}
                </h3>
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">Concepto *</label>
                  <input
                    type="text"
                    required
                    placeholder="Ej: 500L Gasoil B / Liquidación aceituna"
                    value={financeModal.concept}
                    onChange={(e) => setFinanceModal({ ...financeModal, concept: e.target.value })}
                    className="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs"
                  />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Importe (€) *</label>
                    <input
                      type="number"
                      step="0.01"
                      required
                      value={financeModal.amount}
                      onChange={(e) => setFinanceModal({ ...financeModal, amount: e.target.value })}
                      className="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Fecha ({formatDateES(financeModal.date)})</label>
                    <input
                      type="date"
                      value={financeModal.date}
                      onChange={(e) => setFinanceModal({ ...financeModal, date: e.target.value })}
                      className="w-full border border-slate-300 rounded-xl px-2.5 py-2 text-xs"
                    />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setFinanceModal(null)}
                    className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-xl"
                  >
                    Cancelar
                  </button>
                  <button
                    type="submit"
                    className={`px-4 py-2 text-xs font-bold text-white rounded-xl ${
                      financeModal.type === "ingreso" ? "bg-emerald-800" : "bg-rose-700"
                    }`}
                  >
                    Guardar
                  </button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
